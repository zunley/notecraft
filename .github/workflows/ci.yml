# CI：测试（服务端 pytest + 客户端 tsc/vite + 依赖铁律）→ 打 v* tag 时释出镜像到 ghcr.io
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/server/requirements.txt
            src/server/requirements-dev.txt
      - name: 服务端测试（分层单测 + HTTP 集成 + 架构铁律）
        run: |
          pip install -r src/server/requirements.txt -r src/server/requirements-dev.txt
          python -m pytest src/server/tests -q
          python src/server/tests/smoke.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/client/web/package-lock.json
      - name: 客户端构建 + 依赖铁律（dependency-cruiser）
        working-directory: src/client/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run lint:deps

  # 镜像释出：服务端（后端 + Web 静态托管单容器）与 Web 客户端（nginx 分容器形态）
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zunley/notecraft-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zunley/notecraft
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: 服务端镜像（Dockerfile：后端 + Web 静态托管）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web 客户端镜像（Dockerfile.web：nginx 静态 + 同源代理）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
