# 释出流水线：打 v* tag → 测试 → 三端出包 → 挂到 GitHub Release
# - 桌面（Tauri）：Windows（nsis/msi）、macOS（universal dmg）、Linux（deb/rpm）
# - Android（Tauri mobile）：APK（arm64，侧载安装/覆盖升级）
# 版本号以 tag 为准（构建前同步进 tauri.conf.json）；Android 签名 secrets 未配置时用临时密钥并告警。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # 测试闸门（与 ci.yml 同口径）：不通过就不打包
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/server/requirements.txt
            src/server/requirements-dev.txt
      - name: 服务端测试（分层单测 + HTTP 集成 + 架构铁律）
        run: |
          pip install -r src/server/requirements.txt -r src/server/requirements-dev.txt
          python -m pytest src/server/tests -q
          python src/server/tests/smoke.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/client/web/package-lock.json
      - name: 客户端构建 + 依赖铁律（dependency-cruiser）
        working-directory: src/client/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run lint:deps

  # 桌面安装包：各平台在原生 runner 上出包（跨平台打包不可行，故矩阵三跑）
  desktop:
    name: 桌面（${{ matrix.platform }}）
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            rust-targets: ""
          - platform: macos
            os: macos-latest
            # 通用二进制：Intel + Apple Silicon 一个 dmg
            rust-targets: "x86_64-apple-darwin,aarch64-apple-darwin"
          - platform: linux
            os: ubuntu-latest
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri Linux 构建依赖：GTK/WebKit/托盘/图标（官方依赖清单）
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/client/web/package-lock.json
      - name: 安装前端依赖
        working-directory: src/client/web
        run: npm ci --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/client/tauri

      - name: 版本号与 tag 对齐
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' src/client/tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src/client/tauri/tauri.conf.json

      - name: 构建安装包（tauri build）
        working-directory: src/client/tauri
        run: |
          args=()
          case "${{ matrix.platform }}" in
            macos) args+=(--target universal-apple-darwin) ;;
            # AppImage 依赖 FUSE 且易碎，Linux 只出 deb/rpm
            linux) args+=(--bundles deb,rpm) ;;
          esac
          ../web/node_modules/.bin/tauri build "${args[@]}"

      - name: 收集安装包
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            windows)
              cp src/client/tauri/target/release/bundle/nsis/*.exe dist/
              cp src/client/tauri/target/release/bundle/msi/*.msi dist/
              ;;
            macos)
              cp src/client/tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
              ;;
            linux)
              cp src/client/tauri/target/release/bundle/deb/*.deb dist/
              cp src/client/tauri/target/release/bundle/rpm/*.rpm dist/
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Android：gen/android 每次由 tauri android init 现场生成（不入库），出包后用密钥签名
  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/client/web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安装前端依赖
        working-directory: src/client/web
        run: npm ci --no-audit --no-fund

      - name: 定位 / 安装 Android NDK
        run: |
          # runner 自带 SDK（ANDROID_HOME）；Tauri 需要 NDK，取已装的最高版本，缺失才安装
          ndk_dir="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$ndk_dir" ]; then
            sdkm="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
            yes | "$sdkm" "ndk;27.0.12077973" >/dev/null 2>&1 || true
            ndk_dir="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          [ -d "$ndk_dir" ] || { echo "Android NDK 不可用：$ndk_dir"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "使用 NDK：$ndk_dir"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/client/tauri

      - name: 版本号与 tag 对齐
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' src/client/tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src/client/tauri/tauri.conf.json

      # 注意：必须用 npm run 调 CLI——gradle 的 BuildTask 会烤进「npm run -- tauri …」
      # 供其构建时回调 CLI（android-studio-script），依赖本目录 package.json 的 tauri 脚本
      - name: 生成 Android 工程（gen/android）
        working-directory: src/client/tauri
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: 构建 APK（arm64）
        working-directory: src/client/tauri
        # 只出 arm64（armv7 老设备已边缘化）；如需兼容老设备加回 armv7，
        # 如需上架商店再加 --aab 出 AAB
        run: npm run tauri -- android build --target aarch64 --apk

      # 正式签名密钥（一次性生成、妥善保存；丢失后无法向老用户发升级）：
      #   keytool -genkeypair -v -keystore notecraft-upload.keystore -alias notecraft \
      #     -keyalg RSA -keysize 2048 -validity 10000
      # 仓库 secrets 配置：
      #   ANDROID_KEYSTORE_BASE64    # base64 -w0 notecraft-upload.keystore
      #   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
      # Tauri 的 Android 模板不带签名配置，故产物在此统一签名（zipalign + apksigner）：
      # 固定密钥 = 新 APK 能覆盖安装升级、保留数据；每次临时密钥则系统视为另一个应用，必须卸载重装。
      - name: 签名 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          KS="$RUNNER_TEMP/notecraft.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning title=Android 临时签名密钥::未配置 ANDROID_KEYSTORE_BASE64 等 secrets，本次以临时密钥签名（只能试装，无法升级）。正式发布请按本步骤注释生成密钥并配置 secrets"
            STORE_PASS=notecraft
            KEY_ALIAS=notecraft
            KEY_PASS=notecraft
            keytool -genkeypair -keystore "$KS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=notecraft CI" >/dev/null 2>&1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version src/client/tauri/tauri.conf.json)"
          fi

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p dist

          find gen/android/app/build/outputs/apk -name '*.apk' | while read -r apk; do
            aligned="$RUNNER_TEMP/$(basename "$apk")"
            "$BT/zipalign" -p -f 4 "$apk" "$aligned"
            "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$STORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
              --out "dist/notecraft_${VERSION}_android.apk" "$aligned"
          done
          "$BT/apksigner" verify "dist/notecraft_${VERSION}_android.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-android
          path: dist/*
          if-no-files-found: error

  # 汇总所有安装包 → 创建 GitHub Release（仅 tag 触发时）
  release:
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      - name: 校验产物
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
