# notecraft Web 版独立部署：API 与 Web 客户端分容器（同一套 UI）
#
#   docker compose -f compose.web.yaml up -d
#   浏览器打开 http://localhost:8081/ 即可使用
#
# 默认「同源代理」模式：浏览器只访问 web 容器，nginx 把 /api、/health 代理到服务端
# （单源、免 CORS 配置）。要让 Web 直连某个服务端（不同源）：
#   1) web 服务设 NOTE_MD_SERVER_URL=https://api.example.com
#   2) 该服务端设 NOTE_MD_ALLOWED_ORIGINS=https://your-web-host
#
# 单容器形态（API + 内嵌 Web 静态托管，端口 8080）见 compose.yaml。
services:
  server:
    build: .
    image: ghcr.io/zunley/notecraft-server:latest
    ports:
      - "${NOTE_MD_PORT:-8080}:8080"   # 桌面端同步 / 直连客户端需要；仅 Web 同源代理时可注释
    volumes:
      - ./notes:/notes                 # 各用户密文仓库（<uid>/ 分目录）
      - ./data:/data                   # 用户表 + protected_key（必须备份）
    environment:
      NOTE_MD_REGISTRATION: ${NOTE_MD_REGISTRATION:-open}
      NOTE_MD_INVITE_CODE: ${NOTE_MD_INVITE_CODE:-}
      NOTE_MD_TOKEN_TTL: ${NOTE_MD_TOKEN_TTL:-72h}
      NOTE_MD_DATA_DIR: ${NOTE_MD_DATA_DIR:-/data}
      NOTE_MD_ALLOWED_ORIGINS: ${NOTE_MD_ALLOWED_ORIGINS:-}   # 仅 Web 直连跨源时需要
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TZ: Asia/Shanghai
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ghcr.io/zunley/notecraft:latest
    ports:
      - "${NOTE_MD_WEB_PORT:-8081}:80"
    environment:
      NOTE_MD_API_UPSTREAM: http://server:8080   # 同源代理目标（compose 服务名）
      NOTE_MD_SERVER_URL: ${NOTE_MD_SERVER_URL:-}  # 空 = 同源代理（推荐）
    depends_on:
      - server
    restart: unless-stopped
