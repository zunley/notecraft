[package]
name = "notecraft"
version = "0.1.0"
edition = "2021"
description = "本地优先跨平台 Markdown 笔记本"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TODO: 按需增补插件（dialog 目录选择、updater 签名等）
