[package]
name = "notecraft"
version = "0.1.0"
edition = "2021"
description = "本地优先跨平台 Markdown 笔记本"

# 移动端（Android/iOS）要求 lib target：唯一实现在 src/lib.rs，桌面入口 main.rs 调用
[lib]
name = "notecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2" # 注册与签名密钥随 M6 发布补齐
serde = { version = "1", features = ["derive"] }
serde_json = "1"
