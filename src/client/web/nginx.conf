# notecraft Web 客户端（nginx 静态 + 同源代理）
#
# 两种接入模式：
# - 同源代理（默认，推荐）：NOTE_MD_SERVER_URL 为空 → 浏览器把 /api、/health 发到本容器，
#   nginx 代理到 NOTE_MD_API_UPSTREAM（默认 http://server:8080，即 compose 里的服务端）。
#   浏览器视角单源，服务端无需 CORS 配置。
# - 直连：NOTE_MD_SERVER_URL=https://api.example.com → 浏览器直连服务端，
#   此时服务端需配 NOTE_MD_ALLOWED_ORIGINS；下方代理配置闲置但不影响启动
#   （proxy_pass 走变量 + resolver127.0.0.11，上游不可达也不阻塞 nginx 启动）。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker 内置 DNS（容器网络）；变量形式的 proxy_pass 在请求时才解析上游
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream "${NOTE_MD_API_UPSTREAM}";

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 运行时配置：容器启动时由40-runtime-config.sh 按 NOTE_MD_SERVER_URL 重写（不缓存）
  location = /runtime-config.js {
    add_header Cache-Control "no-store";
  }

  # 同源代理：认证 / 同步 / 中继（含 SSE 流式——关闭缓冲）
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location = /health {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  # 构建产物内容寻址：长缓存
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA 回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
